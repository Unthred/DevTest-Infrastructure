<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dashboard (anonymised fixture)</title><link rel="stylesheet" href="/ha.css"><script src="/ha.js"></script></head>
<body>
<header><a href="/dashboard.html">Overview</a><a href="/heating-settings.html">Heating Settings</a><a href="/heating-season.html">Heating Season</a></header>
<main>
<section class="card" data-ui="card"><h2>Living room</h2><div class="row"><span>Temperature 20.5 °C</span><button type="button" data-mutates aria-label="Turn light on">Light</button></div></section>
<section class="card" data-ui="card"><h2>Climate: Zone 1 thermostat with a deliberately long friendly name</h2><div class="row"><button type="button" data-mutates aria-label="Lower">−</button><span>Target 21 °C</span><button type="button" data-mutates aria-label="Raise">+</button></div></section>
<section class="card" data-ui="card"><h2>Hot water</h2><div class="row"><span>Boost</span><label><input type="checkbox" data-mutates aria-label="Boost"> on</label></div></section>
</main>
</body>
