name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: devtest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate project contract
        run: node tools/validate-project.mjs
      - name: Positive and negative validator tests
        run: node --test "tests/**/*.test.mjs"
