name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]   # edited: the PR body is checked too
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Issue #149: a description edit runs in its own group, so it can never cancel the run for a push (and a push never cancels it).
  group: devtest-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'edited' && 'edit' || 'code' }}
  cancel-in-progress: true

jobs:
  project-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate project contract
        run: node tools/validate-project.mjs
      - name: Positive and negative validator tests
        run: node --test "tests/**/*.test.mjs"

  commit-attribution:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No AI attribution in commit messages or the pull request body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash tools/ci/validate-commit-attribution.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  no-handover-edit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Feature branches do not edit the handover (D-023)
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: bash tools/ci/validate-no-handover-edit.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
