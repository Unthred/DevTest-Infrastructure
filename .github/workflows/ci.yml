name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]   # edited: the PR body is checked too
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Issue #149: a description edit runs in its own group, so it can never cancel the run for a push (and a push never cancels it).
  group: devtest-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'edited' && 'edit' || 'code' }}
  cancel-in-progress: true

jobs:
  project-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate project contract
        run: node tools/validate-project.mjs
      - name: Positive and negative validator tests
        run: node tools/test-guard.mjs -- node --test "tests/**/*.test.mjs"

  ci-lint:
    # Issue #12: shell syntax, workflow safety and image-lock checks. No Docker, no network, no secrets.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint shell, workflows and the image lock
        run: node tools/ci/check-ci.mjs

  commit-attribution:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No AI attribution in commit messages or the pull request body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash tools/ci/validate-commit-attribution.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  no-handover-edit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Feature branches do not edit the handover (D-023)
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: bash tools/ci/validate-no-handover-edit.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  decision-status:
    # Issue #303: agents add decisions as proposals only; approval needs a recorded homeowner comment.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Only the homeowner approves a decision
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" --paginate --jq '[.[] | {login: .user.login, body: .body, url: .html_url, id: .id}]' | jq -s 'add // []' > "${RUNNER_TEMP}/approvals.json"
          node tools/ci/validate-decision-status.mjs "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" "${RUNNER_TEMP}/approvals.json"
