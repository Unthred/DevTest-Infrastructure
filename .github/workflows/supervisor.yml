name: Supervisor
on:
  pull_request:
  push:
    branches: [main, codex/issue-15-supervisor]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: node tools/test-guard.mjs -- node --test 'tests/**/*.test.mjs'
      - run: node --check supervisor/cli.mjs
      - run: node --check supervisor/process.mjs
      - run: node --check supervisor/core.mjs
      - run: node --check supervisor/team.mjs
      - run: node --check supervisor/github.mjs
